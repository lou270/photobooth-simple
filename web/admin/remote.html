<!DOCTYPE html>
<html lang="{{ g.lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhotoBooth - {{ t('web.admin.remote_page_title') }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
    <style>
        .remote-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }

        .remote-card {
            overflow: hidden;
        }

        .remote-card img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            background: var(--panel-muted);
        }

        .remote-card-body {
            padding: 14px;
        }

        .remote-card .chip {
            margin-bottom: 8px;
        }

        .remote-meta {
            margin: 0 0 12px;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .filters {
            align-items: center;
            margin-bottom: 18px;
        }

        .filters .spacer {
            flex: 1;
        }
    </style>
</head>
<body>
    {% set active = 'remote' %}
    {% include 'partials/admin_topbar.html' %}

    <main class="page-shell">
        <div class="page-container">
            <section class="page-hero">
                <div>
                    <h1>{{ t('web.admin.remote_title') }}</h1>
                    <p>{{ t('web.admin.remote_intro') }}</p>
                </div>
            </section>

            {% if not remote_enabled %}
            <div class="warning-box">
                {{ t('web.admin.remote_disabled_warning') }}
            </div>
            {% endif %}

            <div class="actions filters" role="group">
                <button type="button" class="btn btn-ghost active" data-filter="all">{{ t('web.admin.filter_all') }}</button>
                <button type="button" class="btn btn-ghost" data-filter="pending">{{ t('web.admin.filter_pending') }}</button>
                <button type="button" class="btn btn-ghost" data-filter="printed">{{ t('web.admin.filter_printed') }}</button>
                <button type="button" class="btn btn-ghost" data-filter="rejected">{{ t('web.admin.filter_rejected') }}</button>
                <span class="spacer"></span>
                <button id="refreshButton" type="button" class="btn btn-primary">{{ t('web.admin.refresh') }}</button>
            </div>

            <section id="grid" class="remote-grid"></section>
            <div id="emptyState" class="panel empty-state">{{ t('web.admin.loading_photos') }}</div>
        </div>
    </main>

    <script>
        const I18N = {{ js_i18n|tojson }};
        const grid = document.getElementById('grid');
        const emptyState = document.getElementById('emptyState');
        const refreshButton = document.getElementById('refreshButton');
        const filterButtons = document.querySelectorAll('[data-filter]');

        const STATUS_LABELS = {
            pending: I18N.status_pending,
            printed: I18N.status_printed,
            rejected: I18N.status_rejected,
        };

        let photos = [];
        let activeFilter = 'all';

        function render() {
            const visible = activeFilter === 'all'
                ? photos
                : photos.filter((photo) => photo.status === activeFilter);

            grid.replaceChildren(...visible.map(buildCard));
            emptyState.hidden = visible.length > 0;
            if (!visible.length) {
                emptyState.textContent = photos.length
                    ? I18N.no_photo_with_status
                    : I18N.no_photo_yet;
            }
        }

        function buildCard(photo) {
            const card = document.createElement('article');
            card.className = 'panel remote-card';

            const image = document.createElement('img');
            image.src = `/remote/photo/${encodeURIComponent(photo.id)}?size=small`;
            image.alt = `${I18N.photo_received_on_alt} ${photo.received_at}`;
            image.loading = 'lazy';
            card.appendChild(image);

            const body = document.createElement('div');
            body.className = 'remote-card-body';

            const chip = document.createElement('span');
            chip.className = `chip ${photo.status}`;
            chip.textContent = STATUS_LABELS[photo.status] || photo.status;
            body.appendChild(chip);

            const meta = document.createElement('p');
            meta.className = 'remote-meta';
            meta.textContent = `${photo.received_at.replace('T', ' ')} · ${I18N.phone_label} ${photo.sender}`;
            body.appendChild(meta);

            const actions = document.createElement('div');
            actions.className = 'actions';

            if (photo.status !== 'rejected') {
                actions.appendChild(makeButton(I18N.reject, 'btn-warning', () => reject(photo.id)));
            }
            actions.appendChild(makeButton(I18N.delete, 'btn-danger', () => remove(photo.id)));

            body.appendChild(actions);
            card.appendChild(body);
            return card;
        }

        function makeButton(label, variant, onClick) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = `btn ${variant}`;
            button.textContent = label;
            button.addEventListener('click', onClick);
            return button;
        }

        async function load() {
            try {
                const response = await fetch('/api/remote/photos');
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || I18N.load_failed);
                photos = data.photos || [];
                render();
            } catch (error) {
                grid.replaceChildren();
                emptyState.hidden = false;
                emptyState.textContent = error.message;
            }
        }

        async function reject(id) {
            await call(`/api/remote/photos/${encodeURIComponent(id)}/reject`, 'POST');
        }

        async function remove(id) {
            if (!confirm(I18N.confirm_delete)) return;
            await call(`/api/remote/photos/${encodeURIComponent(id)}`, 'DELETE');
        }

        async function call(url, method) {
            try {
                const response = await fetch(url, { method });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || I18N.action_failed);
                await load();
            } catch (error) {
                emptyState.hidden = false;
                emptyState.textContent = error.message;
            }
        }

        filterButtons.forEach((button) => {
            button.addEventListener('click', () => {
                activeFilter = button.dataset.filter;
                filterButtons.forEach((other) => other.classList.toggle('active', other === button));
                render();
            });
        });

        refreshButton.addEventListener('click', load);
        load();
    </script>
</body>
</html>
