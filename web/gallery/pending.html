<!DOCTYPE html>
<html lang="{{ g.lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171a2f">
    <!-- Reloading is the whole mechanism: the booth answers this address with
         the collage as soon as it is saved, which takes a few seconds. -->
    <meta http-equiv="refresh" content="2">
    <title>PhotoBooth</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
    <style>
        .spinner {
            width: 52px;
            height: 52px;
            margin: 0 auto 18px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: var(--champagne);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .spinner { animation-duration: 3s; }
        }
    </style>
</head>
<body class="theme-guest">
    {% set show_gallery_link = false %}
    {% include 'partials/guest_topbar.html' %}

    <main class="center-shell">
        <section class="panel center-card">
            <div class="spinner" aria-hidden="true"></div>
            <h1>{{ t('web.gallery.pending_title') }}</h1>
            <p>{{ t('web.gallery.pending_message') }}</p>
        </section>
    </main>
</body>
</html>
